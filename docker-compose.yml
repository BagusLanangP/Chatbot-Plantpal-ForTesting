version: '3.8'

services:
  backend:
    build: ./backend
    container_name: plantpal-backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend/plantpal.db:/app/plantpal.db
    ports:
      - "8010:8000"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8010}
    container_name: plantpal-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
